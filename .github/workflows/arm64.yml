name: build-arm64-release
on: workflow_dispatch

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config nasm \
            libx11-dev libxkbcommon-dev libwayland-dev libasound2-dev \
            libudev-dev libssl-dev

      - name: Toolchain
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build tool
        run: |
          cd tool
          cargo build --release

      - name: Collect binary
        run: |
          mkdir -p dist
          BIN=$(find . -type f -path '*/target/release/refunct-tas' | head -n1)
          echo "Found: $BIN"
          cp "$BIN" dist/refunct-tas
          file dist/refunct-tas
          tar -C dist -czf refunct-tas-linux-aarch64.tar.gz refunct-tas

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: arm64-build-${{ github.run_number }}
          name: refunct-tas arm64 build ${{ github.run_number }}
          body: Unofficial aarch64 build of refunct-tas for the Refunct Archipelago mod. Use with the x86_64 librtil.so from the upstream release.
          files: refunct-tas-linux-aarch64.tar.gz
